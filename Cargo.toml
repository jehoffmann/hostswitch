# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = ["crates/hostswitch-core", "crates/hostswitch-backends", "crates/hostswitchctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

hostswitch-core = { path = "crates/hostswitch-core" }
hostswitch-backends = { path = "crates/hostswitch-backends" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
